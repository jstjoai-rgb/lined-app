<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LINED. — the door</title><style>html,body{height:100%;margin:0}:root{--bg:#12161A;--paper:#FBF7EE;--papertext:#15181B;--chalk:#E4EAEF;--china:#E5533D;--china2:#C0392B;--dim:#7E8B95}</style><!-- ═══════════════ LINED. — the door ═══════════════
     A doorman, not a lock. The answer is stored as a hash so it isn't sitting
     in the source as plain text, but anyone with devtools can remove the
     overlay. For real protection use the host's password setting.

     TO CHANGE THE ANSWER — in any browser console:
       crypto.subtle.digest("SHA-256", new TextEncoder().encode("your answer"))
         .then(b=>console.log([...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")))
     …then also update FALLBACK below with: btoa("your answer")
     Matching ignores case, punctuation and extra spaces.
     ═══════════════════════════════════════════════ -->
<style>
#gate{position:fixed;inset:0;z-index:9999;background:var(--bg,#12161A);color:var(--chalk,#E4EAEF);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  font-family:var(--doorfont,ui-monospace),"SF Mono",Menlo,monospace;padding:24px}
#gate.gone{display:none}
#gate .top{position:absolute;top:22px;left:26px;font-size:14px;font-weight:700;letter-spacing:.16em}
#gate .top i{font-style:normal;color:var(--china,#E5533D)}
#gate .card{position:relative;background:var(--paper,#FBF7EE);color:var(--papertext,#15181B);
  width:100%;max-width:560px;padding:54px 60px 58px;box-shadow:0 22px 60px rgba(0,0,0,.34);border-radius:2px}
#gate .rule{position:absolute;top:0;right:64px;bottom:0;width:0}
#gate .rule svg{position:absolute;top:0;left:-9px;height:100%;width:18px}
#gate .slug{font-size:11px;letter-spacing:.22em;opacity:.5;margin-bottom:52px}
#gate .cue{font-size:12px;letter-spacing:.36em;opacity:.55;text-align:center;margin-bottom:16px}
#gate .ask{font-size:31px;font-weight:400;line-height:1.25;text-align:center;margin:0 0 40px}
#gate .ask i{font-style:normal;color:var(--china2,#C0392B)}
#gate input{display:block;background:transparent;border:0;border-bottom:1px solid currentColor;
  color:inherit;font:inherit;font-size:20px;text-align:center;padding:9px 6px;
  width:82%;margin:0 auto;outline:0;letter-spacing:.03em;transition:border-color .35s ease}
#gate input{opacity:.92}
#gate input:focus{border-bottom-color:var(--china2,#C0392B);opacity:1}
#gate input::placeholder{opacity:.3}
#gate .hint{font-size:12.5px;opacity:.6;margin-top:26px;min-height:30px;line-height:1.8;
  text-align:center;transition:opacity .3s ease}
#gate .hint b{color:var(--china2,#C0392B);font-weight:400;opacity:1}
#gate .hint.fade{opacity:0}
#gate .foot{font-size:10.5px;letter-spacing:.14em;color:var(--dim,#7E8B95)}
@keyframes settle{0%{transform:translateY(-3px);opacity:.5}100%{transform:translateY(0);opacity:1}}
#gate.again input{animation:settle .5s ease}
@media (prefers-reduced-motion:reduce){#gate.again input{animation:none}}
@media (max-width:520px){#gate .card{padding:30px 24px 34px}#gate .rule{right:26px}}
</style>

<div id="gate">
  <div class="top">LINED<i>.</i></div>
  <div class="card">
    <div class="rule"><svg viewBox="0 0 18 400" preserveAspectRatio="none" aria-hidden="true">
      <line x1="9" y1="26" x2="9" y2="374" stroke="var(--china2,#C0392B)" stroke-width="2"/>
      <line x1="2" y1="26" x2="16" y2="26" stroke="var(--china2,#C0392B)" stroke-width="2"/>
      <line x1="2" y1="374" x2="16" y2="374" stroke="var(--china2,#C0392B)" stroke-width="2"/>
    </svg></div>
    <div class="slug">INT. STAGE — CONTINUOUS</div>
    <div class="cue">YOU</div>
    <div class="ask">What's my line again<i>?</i></div>
    <input id="gk" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="…">
    <div class="hint" id="gh">Take your time. The script supervisor has it.</div>
  </div>
  <div class="foot">a prototype — please keep it between us</div>
</div>

<script>
(function(){
  var ANSWER   = "90e4f80c17ced4daa65e8c3c96e131575713a23218c612481691315914278507";
  var FALLBACK = "eW91IHNhaWQgdHVlc2RheQ==";   // used only where crypto.subtle is unavailable
  var HINTS = [
    "Take your time. The script supervisor has it.",
    "Not that one. Try again whenever you're ready.",
    "It's the first thing she says in the scene.",
    "Three words. She says it twice.",
    "Starts with <b>you</b>."
  ];
  var gate = document.getElementById("gate"),
      inp  = document.getElementById("gk"),
      hint = document.getElementById("gh"),
      misses = 0;

  function norm(s){ return s.toLowerCase().replace(/[^\w\s]/g,"").replace(/\s+/g," ").trim(); }

  // crypto.subtle only exists in a secure context — fall back where it doesn't
  function check(v){
    if (window.crypto && crypto.subtle && crypto.subtle.digest) {
      return crypto.subtle.digest("SHA-256", new TextEncoder().encode(v))
        .then(function(b){
          return [].slice.call(new Uint8Array(b))
            .map(function(x){ return x.toString(16).padStart(2,"0"); }).join("") === ANSWER;
        })
        .catch(function(){ return v === atob(FALLBACK); });
    }
    return Promise.resolve(v === atob(FALLBACK));
  }

  function say(html){
    hint.classList.add("fade");
    setTimeout(function(){ hint.innerHTML = html; hint.classList.remove("fade"); }, 220);
  }
  function open_(){
    gate.classList.add("gone");
    try{ localStorage.setItem("lined:door", ANSWER); }catch(e){}
  }
  try{ if(localStorage.getItem("lined:door") === ANSWER) open_(); }catch(e){}

  inp.addEventListener("keydown", function(e){
    if(e.key !== "Enter") return;
    var v = norm(inp.value);
    if(!v) return;
    check(v).then(function(ok){
      if(ok){ say("<b>That's the one.</b>"); setTimeout(open_, 620); return; }
      misses++;
      gate.classList.add("again");
      setTimeout(function(){ gate.classList.remove("again"); }, 520);
      say(HINTS[Math.min(misses, HINTS.length - 1)]);
      inp.select();
    });
  });

  if(!gate.classList.contains("gone")) setTimeout(function(){ inp.focus(); }, 300);
})();
</script>
