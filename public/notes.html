<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#E8DFCD">
<title>LINED. — notes</title>
<style>
:root{--bg:#E8DFCD;--paper:#FBF7EE;--ink:#2B2620;--dim:#8A7F6C;--line:#D6CBB4;--china:#A8503A;--go:#4E8C72;
  --mono:ui-monospace,"SF Mono",Menlo,monospace}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.6 var(--mono);padding:26px 20px 60px}
.wrap{max-width:620px;margin:0 auto}
.top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:26px}
.brand{font-size:15px;font-weight:700;letter-spacing:.16em}
.brand i{font-style:normal;color:var(--china)}
.top span{font-size:10px;letter-spacing:.18em;color:var(--dim)}
.card{position:relative;background:var(--paper);padding:34px 34px 30px;box-shadow:0 16px 44px rgba(70,58,38,.14)}
.card::after{content:"";position:absolute;top:26px;bottom:26px;right:22px;width:2px;background:var(--china)}
h1{font-size:20px;font-weight:400;margin:0 0 6px;letter-spacing:.01em}
h1 i{font-style:normal;color:var(--china)}
.sub{color:var(--dim);font-size:12px;margin-bottom:26px;line-height:1.7}
label{display:block;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin:16px 0 5px}
input,select,textarea{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);
  color:var(--ink);font:inherit;font-size:14px;padding:7px 2px;outline:0;border-radius:0}
input:focus,select:focus,textarea:focus{border-bottom-color:var(--china)}
textarea{min-height:132px;resize:vertical;line-height:1.65}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.pill{border:1px solid var(--line);padding:5px 11px;font-size:11px;cursor:pointer;user-select:none;
  letter-spacing:.06em}
.pill.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.pill.on[data-v="CUT"]{background:var(--china);border-color:var(--china)}
.row{display:flex;gap:18px;flex-wrap:wrap}
.row>div{flex:1;min-width:150px}
button.send{margin-top:26px;background:var(--ink);color:var(--paper);border:0;padding:13px 22px;
  font:inherit;font-size:12px;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;border-radius:2px}
button.send:disabled{opacity:.45;cursor:default}
.msg{margin-top:16px;font-size:12px;min-height:20px}
.msg.bad{color:var(--china)}
.msg.good{color:var(--go)}
.foot{text-align:center;color:var(--dim);font-size:10px;letter-spacing:.14em;margin-top:24px}
.sent{display:none;text-align:center;padding:26px 0}
.sent.on{display:block}
.sent b{display:block;font-size:17px;font-weight:400;margin-bottom:8px}
.again{background:none;border:0;color:var(--china);font:inherit;font-size:12px;cursor:pointer;text-decoration:underline}
</style>

<div class="wrap">
  <div class="top"><div class="brand">LINED<i>.</i></div><span>NOTES</span></div>

  <div class="card">
    <div id="form">
      <h1>What needs to change<i>?</i></h1>
      <div class="sub">One note at a time is easiest to act on — send as many as you like.
        If it's about something in the review pack, put its code in and I'll find it.</div>

      <div class="row">
        <div><label>Your name</label><input id="who" autocomplete="name" placeholder="—"></div>
        <div><label>Passphrase</label><input id="pass" type="password" autocomplete="current-password" placeholder="—"></div>
      </div>

      <div class="row">
        <div><label>Where</label>
          <select id="screen">
            <option>Line — the page</option><option>Line — rails and takes</option>
            <option>Log</option><option>Report</option><option>Day</option>
            <option>The printed log</option><option>Layout</option><option>Colour</option>
            <option>The name / logo</option><option>The door</option><option>Something else</option>
          </select></div>
        <div><label>Code, if it has one</label><input id="code" placeholder="S7, L2, R1…"></div>
      </div>

      <label>Verdict</label>
      <div class="pills" id="verdict">
        <div class="pill on" data-v="CHANGE">Change it</div>
        <div class="pill" data-v="CUT">Cut it</div>
        <div class="pill" data-v="ADD">Add something</div>
        <div class="pill" data-v="KEEP">Keep — just saying</div>
      </div>

      <label>The note</label>
      <textarea id="note" placeholder="Be blunt. “This is wrong” beats “maybe consider”."></textarea>

      <button class="send" id="send">Send it</button>
      <div class="msg" id="msg"></div>
    </div>

    <div class="sent" id="sent">
      <b>Got it.</b>
      <div class="sub" style="margin:0">Noted and timestamped.</div>
      <button class="again" id="again">Send another</button>
    </div>
  </div>

  <div class="foot">LINED.FILM · PROTOTYPE FEEDBACK</div>
</div>

<script>
"use strict";
var verdict = "CHANGE";
document.getElementById("verdict").addEventListener("click", function (e) {
  var p = e.target.closest(".pill"); if (!p) return;
  document.querySelectorAll("#verdict .pill").forEach(function (x) { x.classList.remove("on"); });
  p.classList.add("on"); verdict = p.dataset.v;
});

var msg = document.getElementById("msg"), btn = document.getElementById("send");

function say(t, cls) { msg.className = "msg " + (cls || ""); msg.textContent = t; }

btn.addEventListener("click", async function () {
  var pass = document.getElementById("pass").value.trim();
  var note = document.getElementById("note").value.trim();
  if (!pass) { say("The passphrase is missing.", "bad"); return; }
  if (!note) { say("Write the note first.", "bad"); return; }
  btn.disabled = true; say("Sending…");
  try {
    var r = await fetch("/api/notes", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({
        pass: pass, note: note, verdict: verdict,
        who: document.getElementById("who").value,
        screen: document.getElementById("screen").value,
        code: document.getElementById("code").value
      })
    });
    var d = await r.json().catch(function () { return {}; });
    if (!r.ok) { say(d.error || "That didn't send. Try again?", "bad"); btn.disabled = false; return; }
    document.getElementById("form").style.display = "none";
    document.getElementById("sent").classList.add("on");
  } catch (e) {
    say("No connection. The note is still in the box — try again when you have signal.", "bad");
    btn.disabled = false;
  }
});

document.getElementById("again").addEventListener("click", function () {
  document.getElementById("note").value = "";
  document.getElementById("code").value = "";
  document.getElementById("sent").classList.remove("on");
  document.getElementById("form").style.display = "";
  btn.disabled = false; say("");
  document.getElementById("note").focus();
});
</script>
<script src="./ctrl-markup.js" defer></script>
