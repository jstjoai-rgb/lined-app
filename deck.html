<!-- ═══════════════ LINED. — the door ═══════════════
     A doorman, not a lock. The answer is stored as a hash so it isn't sitting
     in the source as plain text, but anyone with devtools can remove the
     overlay. For real protection use the host's password setting.

     TO CHANGE THE ANSWER — in any browser console:
       crypto.subtle.digest("SHA-256", new TextEncoder().encode("your answer"))
         .then(b=>console.log([...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")))
     …then also update FALLBACK below with: btoa("your answer")
     Matching ignores case, punctuation and extra spaces.
     ═══════════════════════════════════════════════ -->
<style>

<div id="gate">
  <div class="top">LINED<i>.</i></div>
  <div class="card">
    <div class="rule"><svg viewBox="0 0 18 400" preserveAspectRatio="none" aria-hidden="true">
      <line x1="9" y1="26" x2="9" y2="374" stroke="var(--china2,#C0392B)" stroke-width="2"/>
      <line x1="2" y1="26" x2="16" y2="26" stroke="var(--china2,#C0392B)" stroke-width="2"/>
      <line x1="2" y1="374" x2="16" y2="374" stroke="var(--china2,#C0392B)" stroke-width="2"/>
    </svg></div>
    <div class="slug">INT. STAGE — CONTINUOUS</div>
    <div class="cue">YOU</div>
    <div class="ask">What's my line again<i>?</i></div>
    <input id="gk" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="…">
    <div class="hint" id="gh">Take your time. The script supervisor has it.</div>
  </div>
  <div class="foot">a prototype — please keep it between us</div>
</div>

<script>
(function(){
  var ANSWER   = "90e4f80c17ced4daa65e8c3c96e131575713a23218c612481691315914278507";
  var FALLBACK = "eW91IHNhaWQgdHVlc2RheQ==";   // used only where crypto.subtle is unavailable
  var HINTS = [
    "Take your time. The script supervisor has it.",
    "Not that one. Try again whenever you're ready.",
    "It's the first thing she says in the scene.",
    "Three words. She says it twice.",
    "Starts with <b>you</b>."
  ];
  var gate = document.getElementById("gate"),
      inp  = document.getElementById("gk"),
      hint = document.getElementById("gh"),
      misses = 0;

  function norm(s){ return s.toLowerCase().replace(/[^\w\s]/g,"").replace(/\s+/g," ").trim(); }

  // crypto.subtle only exists in a secure context — fall back where it doesn't
  function check(v){
    if (window.crypto && crypto.subtle && crypto.subtle.digest) {
      return crypto.subtle.digest("SHA-256", new TextEncoder().encode(v))
        .then(function(b){
          return [].slice.call(new Uint8Array(b))
            .map(function(x){ return x.toString(16).padStart(2,"0"); }).join("") === ANSWER;
        })
        .catch(function(){ return v === atob(FALLBACK); });
    }
    return Promise.resolve(v === atob(FALLBACK));
  }

  function say(html){
    hint.classList.add("fade");
    setTimeout(function(){ hint.innerHTML = html; hint.classList.remove("fade"); }, 220);
  }
  function open_(){
    gate.classList.add("gone");
    try{ localStorage.setItem("lined:door", ANSWER); }catch(e){}
  }
  try{ if(localStorage.getItem("lined:door") === ANSWER) open_(); }catch(e){}

  inp.addEventListener("keydown", function(e){
    if(e.key !== "Enter") return;
    var v = norm(inp.value);
    if(!v) return;
    check(v).then(function(ok){
      if(ok){ say("<b>That's the one.</b>"); setTimeout(open_, 620); return; }
      misses++;
      gate.classList.add("again");
      setTimeout(function(){ gate.classList.remove("again"); }, 520);
      say(HINTS[Math.min(misses, HINTS.length - 1)]);
      inp.select();
    });
  });

  if(!gate.classList.contains("gone")) setTimeout(function(){ inp.focus(); }, 300);
})();
</script>

/* ---------- little wireframes, drawn from the same shapes as the app ---------- */
function wire(kind){
  const P='fill="var(--paper)"', R='fill="var(--panel)"', L='stroke="var(--accent2)" stroke-width="2"';
  const rails=(x,w)=>`<rect x="${x}" y="14" width="${w}" height="70" ${R}/>`+
    [0,1,2].map(i=>`<rect x="${x+3}" y="${19+i*11}" width="${w-6}" height="7" fill="var(--line2)"/>`).join("");
  const page=(x,y,w,h)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" ${P}/>`+
    `<line x1="${x+w*0.72}" y1="${y+5}" x2="${x+w*0.72}" y2="${y+h-5}" ${L}/>`+
    [0,1,2,3].map(i=>`<line x1="${x+4}" y1="${y+8+i*8}" x2="${x+w*0.55}" y2="${y+8+i*8}" stroke="var(--line2)" stroke-width="1.5"/>`).join("");
  let inner="";
  if(kind==="three")      inner=rails(2,26)+page(32,14,88,70)+rails(124,34);
  else if(kind==="stack") inner=rails(2,34)+page(40,14,118,70);
  else if(kind==="hsplit")inner=page(52,14,56,46)+`<rect x="2" y="64" width="156" height="20" ${R}/>`+
                                [0,1,2,3].map(i=>`<rect x="${6+i*39}" y="68" width="33" height="12" fill="var(--line2)"/>`).join("");
  else if(kind==="spread")inner=page(24,14,52,46)+page(84,14,52,46)+`<rect x="2" y="64" width="156" height="20" ${R}/>`+
                                [0,1,2,3].map(i=>`<rect x="${6+i*39}" y="68" width="33" height="12" fill="var(--line2)"/>`).join("");
  else if(kind==="dock")  inner=page(38,14,84,60)+`<rect x="2" y="78" width="156" height="10" ${R}/>`;
  else if(kind==="split") inner=page(14,14,102,70)+rails(122,36);
  else                    inner=page(30,14,100,70)+`<rect x="4" y="18" width="30" height="34" ${R}/>`+
                                `<rect x="126" y="18" width="32" height="42" ${R}/>`;
  return `<svg viewBox="0 0 160 92" preserveAspectRatio="xMidYMid meet">
    <rect x="0" y="0" width="160" height="92" fill="var(--bg)"/>
    <rect x="0" y="0" width="160" height="10" fill="var(--panel)"/>
    <rect x="4" y="3" width="16" height="4" fill="var(--accent)"/>${inner}</svg>`;
}

const LAYS=[["hsplit","Horizontal split","Page above, the day in a band below. For portrait."],
            ["spread","Side by side","Two pages — for a scene that runs over the break."],
            ["dock","Bottom dock","Biggest page by far. Controls in one bar."],
            ["stack","Left stack","One rail instead of two."],
            ["three","Three columns","What it does now. In landscape it costs nothing."],
            ["split","Split","Page and takes only."],
            ["pagefirst","Page first","Rails float over the page."]];

const TYPES=[["mono",'ui-monospace,"SF Mono",Menlo,monospace',"Mono — a document"],
             ["serif",'"Iowan Old Style",Georgia,serif',"Serif — a title card"],
             ["sans",'-apple-system,"Helvetica Neue",Arial,sans-serif',"Sans — an app"],
             ["round",'ui-rounded,"SF Pro Rounded",system-ui,sans-serif',"Rounded — friendlier"]];

const ROWS=[["Draw a coverage line the way you always have",1,1,1,1],
            ["Straight vs wavy — seen vs heard",1,1,0,1],
            ["Take log with slate, duration, circled takes",0,0,1,1],
            ["Log written from the lines, not typed again",0,0,0,1],
            ["Reads the script text on the page",0,0,0,1],
            ["Tells you which lines have NO coverage",0,0,0,1],
            ["Reports what is only ever heard, never seen",0,0,0,1],
            ["Coverage percentage per scene",0,0,0,1],
            ["Works with no battery",1,0,0,0]];

/* ---------- the slides ---------- */
const SLIDES=[

`<h2>Script supervisor software</h2>
 <h1 style="font-size:60px;letter-spacing:.06em">LINED<span class="accent">.</span></h1>
 <p class="big" style="margin-top:8px">The line you already draw, doing the paperwork for you.</p>
 <p class="dim" style="margin-top:34px">Build v1 · prototype · for review</p>
 <p class="dim" style="font-size:12px">Arrow keys, or swipe. Nine slides.</p>`,

`<h2>The problem</h2>
 <h1>Every tool stores what you drew.<br>None of them understand it.</h1>
 <p>A script supervisor's real job isn't writing things down. It's knowing, at 6pm, that everything got shot.</p>
 <div class="cols">
   <div class="card"><div class="rule"></div><b>Paper</b><span>Fast, reliable, no battery. But the arithmetic is in your head, and the log gets written twice.</span></div>
   <div class="card"><div class="rule"></div><b>Scriptation · GoodNotes</b><span>Fine PDF annotators. The coverage line is a pen stroke — pixels. The app can't tell you what's missing.</span></div>
   <div class="card"><div class="rule"></div><b>ScriptE · Moviola</b><span>Real logs. But lining and logging are two separate acts: you draw, then you type it in again.</span></div>
 </div>
 <p style="margin-top:26px;border-left:2px solid var(--accent);padding-left:16px">
   So the one thing that actually goes wrong — a piece of the scene never got a line through it, and nobody
   noticed until the company moved on — is still caught by a human eyeballing a page at wrap.</p>`,

`<h2>The idea</h2>
 <h1>In every other app the line is ink.<br><span class="accent">In LINED. the line is data.</span></h1>
 <p>She draws exactly the line she has always drawn. The app knows it belongs to setup 14C, that 14C belongs to
 scene 14, and that the stroke crosses these particular lines of dialogue. Everything else follows.</p>
 <div class="cols">
   <div class="card"><div class="rule"></div><b>It knows what you haven't shot</b><span>Reads the script text and flags every line with no coverage — live, on the floor.</span></div>
   <div class="card"><div class="rule"></div><b>It separates seen from heard</b><span>Flip to wavy mid-stroke and that stretch is logged off-camera, then reported.</span></div>
   <div class="card"><div class="rule"></div><b>The paperwork is a by-product</b><span>Editor's log, CSV, daily progress, screen time, ratio. Nothing typed twice.</span></div>
 </div>`,

`<h2>Head to head</h2>
 <h1 style="font-size:30px">What each one can actually tell you</h1>
 <table><thead><tr><th></th><th style="text-align:center">Paper</th><th style="text-align:center">Scriptation</th>
 <th style="text-align:center">ScriptE</th><th class="me" style="text-align:center">LINED.</th></tr></thead><tbody>
 ${ROWS.map(r=>`<tr><td>${r[0]}</td>`+[1,2,3,4].map(j=>
    `<td class="c ${r[j]?"y":"n"}${j===4?" me":""}">${r[j]?"●":"—"}</td>`).join("")+"</tr>").join("")}
 </tbody></table>
 <p class="dim" style="margin-top:18px;font-size:13px">Paper still wins the last row, permanently. That's why the
 gesture stays identical and the app works offline.</p>`,

`<h2>Seven ways to arrange it</h2>
 <h1 style="font-size:30px">Tap the one that looks right</h1>
 <div class="lays" id="lays">
   ${LAYS.map(l=>`<div class="lay" data-lay="${l[0]}">${wire(l[0])}<b>${l[1]}</b><span>${l[2]}</span></div>`).join("")}
 </div>
 <p class="dim" style="margin-top:18px;font-size:13px">Every one of them mirrors for a left-handed scripty — one toggle.
 In landscape they all give the page the same room; the choice only changes page size in portrait.</p>`,

`<h2>Sixteen palettes</h2>
 <h1 style="font-size:30px">Tap one — this whole deck changes with it</h1>
 <div class="pals" id="pals">
   ${Object.keys(PALS).map(k=>{const v=PALS[k].v;return `<button class="pal" data-pal="${k}">
     <span class="chip" style="background:${v.bg}"><u style="background:${v.paper}"></u><i style="background:${v.accent}"></i></span>
     <em>${PALS[k].n}</em></button>`}).join("")}
 </div>
 <p class="dim" id="palnote" style="margin-top:16px;font-size:13px"></p>`,

`<h2>The door</h2>
 <h1 style="font-size:30px">It's a prototype, so it asks</h1>
 <div class="door" id="doorwrap" data-df="mono">
   <div class="doorcard">
     <div class="slug">INT. STAGE — CONTINUOUS</div>
     <div class="cue">YOU</div>
     <div class="ask">What's my line again<i>?</i></div>
     <div class="slot"></div>
     <div class="hint">Take your time. The script supervisor has it.</div>
   </div>
   <div>
     <p>“Line?” is what an actor calls when they drop one, and the script supervisor is the person who feeds it
     back. The door asks the same thing the job answers all day.</p>
     <p class="dim">Get it wrong and it helps, one hint at a time, rather than scolding.</p>
     <h3 style="margin-top:22px">Type</h3>
     <div style="display:flex;gap:6px;flex-wrap:wrap">
       ${TYPES.map(t=>`<button data-df="${t[0]}"${t[0]==="mono"?' class="on"':''}>${t[2].split(" — ")[0]}</button>`).join("")}
     </div>
     <p class="dim" style="margin-top:18px;font-size:12px">It borrows whatever palette you picked, so it can never
     arrive looking like a different product.</p>
   </div>
 </div>`,

`<h2>The name</h2>
 <h1 style="font-size:30px">Same word, twelve voices — tap a favourite</h1>
 <div class="typeset" id="typeset">
   ${TYPES.concat([["cond",'"Helvetica Neue Condensed Bold","Arial Narrow",sans-serif',"Condensed — signage"],
                   ["ser2",'"Times New Roman",Times,serif',"Classic serif — old Hollywood"]])
     .map(t=>`<div class="tt" data-type="${t[0]}"><div class="w" style="font-family:${t[1].replace(/"/g,"&quot;")}">LINED<i>.</i></div><small>${t[2]}</small></div>`).join("")}
 </div>
 <div class="typeset" style="margin-top:6px">
   ${TYPES.slice(0,3).map(t=>`<div class="tt" data-type="lower-${t[0]}"><div class="w" style="font-family:${t[1].replace(/"/g,"&quot;")}">Lined<i>.</i></div><small>sentence case — ${t[2].split(" — ")[0]}</small></div>`).join("")}
 </div>
 <p class="dim" style="margin-top:14px;font-size:13px">Caps shout the name. Sentence case says it. The period is the
 full stop at the end of a lined page — or a typo people delete. Your call.</p>`,

`<h2>Your call</h2>
 <h1 style="font-size:30px">Send it and it lands with me</h1>
 <p class="dim">Whatever you tapped is already filled in. Add anything you like — it goes straight into my notes.</p>
 <div class="form">
   <div class="field"><label>Your name</label><input id="v-who" placeholder="—"></div>
   <div class="field"><label>Passphrase</label><input id="v-pass" type="password" placeholder="—"></div>
   <div class="field"><label>Layout</label><input id="v-lay" placeholder="tap one on slide 05"></div>
   <div class="field"><label>Palette</label><input id="v-pal" placeholder="tap one on slide 06"></div>
   <div class="field"><label>The door</label><input id="v-door"></div>
   <div class="field"><label>The name</label><input id="v-type" placeholder="tap one on slide 08"></div>
 </div>
 <div class="field" style="margin-top:18px;max-width:1000px"><label>Anything else</label>
   <textarea id="v-note" placeholder="Be blunt. “This is wrong” beats “maybe consider”."></textarea></div>
 <button class="send" id="v-send">Send it</button>
 <div class="msg" id="v-msg"></div>`
];

/* ---------- deck mechanics ---------- */
const deck=document.getElementById("deck");
deck.innerHTML=SLIDES.map((s,i)=>`<section class="slide" data-i="${i}">${s}</section>`).join("");
const slides=[...document.querySelectorAll(".slide")];
document.getElementById("dots").innerHTML=slides.map((_,i)=>`<b data-go="${i}"></b>`).join("");
let at=0;

function go(i){
  at=Math.max(0,Math.min(slides.length-1,i));
  slides.forEach((s,k)=>s.classList.toggle("on",k===at));
  document.querySelectorAll("#dots b").forEach((d,k)=>d.classList.toggle("on",k===at));
  document.getElementById("count").textContent=
    String(at+1).padStart(2,"0")+" / "+String(slides.length).padStart(2,"0");
  document.getElementById("barfill").style.width=((at+1)/slides.length*100)+"%";
  if(at===slides.length-1)fillVote();
}
function paint(k){
  CHOICE.palette=k;
  const v=PALS[k].v, R=document.documentElement.style;
  for(const key in v)R.setProperty("--"+key,v[key]);
  const tc=document.querySelector('meta[name="theme-color"]');
  if(tc)tc.setAttribute("content",v.bg);
  document.querySelectorAll("[data-pal]").forEach(b=>b.classList.toggle("on",b.dataset.pal===k));
  const n=document.getElementById("palnote");
  if(n)n.innerHTML="<b>"+PALS[k].n+"</b> — "+PALS[k].note;
}
function fillVote(){
  const g=id=>document.getElementById(id);
  if(g("v-lay")&&CHOICE.layout)g("v-lay").value=CHOICE.layout;
  if(g("v-pal"))g("v-pal").value=PALS[CHOICE.palette].n;
  if(g("v-door"))g("v-door").value=CHOICE.door;
  if(g("v-type")&&CHOICE.type)g("v-type").value=CHOICE.type;
}

document.addEventListener("click",e=>{
  const t=e.target;
  if(t.id==="next")return go(at+1);
  if(t.id==="prev")return go(at-1);
  const d=t.closest("[data-go]"); if(d)return go(+d.dataset.go);
  const lay=t.closest("[data-lay]");
  if(lay){CHOICE.layout=lay.querySelector("b").textContent;
    document.querySelectorAll("[data-lay]").forEach(x=>x.classList.remove("on"));
    lay.classList.add("on");return}
  const pal=t.closest("[data-pal]"); if(pal)return paint(pal.dataset.pal);
  const df=t.closest("button[data-df]");
  if(df){CHOICE.door=df.dataset.df;
    document.getElementById("doorwrap").dataset.df=df.dataset.df;
    document.querySelectorAll("button[data-df]").forEach(x=>x.classList.remove("on"));
    df.classList.add("on");return}
  const tt=t.closest("[data-type]");
  if(tt){CHOICE.type=tt.querySelector("small").textContent+" · "+tt.querySelector(".w").textContent;
    document.querySelectorAll("[data-type]").forEach(x=>x.classList.remove("on"));
    tt.classList.add("on");return}
  if(t.id==="v-send")send();
});

document.addEventListener("keydown",e=>{
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName))return;
  if(e.key==="ArrowRight"||e.key===" "||e.key==="PageDown"){e.preventDefault();go(at+1)}
  if(e.key==="ArrowLeft"||e.key==="PageUp"){e.preventDefault();go(at-1)}
  if(e.key==="Home")go(0);
  if(e.key==="End")go(slides.length-1);
});

let tx=null;
document.addEventListener("touchstart",e=>{tx=e.touches[0].clientX},{passive:true});
document.addEventListener("touchend",e=>{
  if(tx===null)return;
  const dx=e.changedTouches[0].clientX-tx;
  if(Math.abs(dx)>60)go(at+(dx<0?1:-1));
  tx=null;
},{passive:true});

async function send(){
  const g=id=>document.getElementById(id);
  const msg=g("v-msg"), btn=g("v-send");
  const pass=g("v-pass").value.trim();
  if(!pass){msg.className="msg bad";msg.textContent="The passphrase is missing.";return}
  const body=["Layout: "+(g("v-lay").value||"—"),
              "Palette: "+(g("v-pal").value||"—"),
              "Door: "+(g("v-door").value||"—"),
              "Name/type: "+(g("v-type").value||"—"),
              "", g("v-note").value.trim()].join("\n").trim();
  btn.disabled=true; msg.className="msg"; msg.textContent="Sending…";
  try{
    const r=await fetch("/api/notes",{method:"POST",headers:{"content-type":"application/json"},
      body:JSON.stringify({pass:pass,who:g("v-who").value,screen:"Deck — the vote",
        verdict:"CHANGE",code:"VOTE",note:body})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok){msg.className="msg bad";msg.textContent=d.error||"That didn't send.";btn.disabled=false;return}
    msg.className="msg good";msg.textContent="Got it. Noted and timestamped.";
  }catch(err){
    msg.className="msg bad";msg.textContent="No connection — try again when you have signal.";
    btn.disabled=false;
  }
}

paint("graphite");
go(0);
</script>
